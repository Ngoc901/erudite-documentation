<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" font-family="Arial, sans-serif">

  <!-- Background -->
  <rect width="900" height="620" fill="#f0f0f0"/>

  <!-- Navbar: dark top strip + light bar -->
  <rect x="0" y="0" width="900" height="8" fill="#c8c8c8"/>
  <rect x="0" y="8" width="900" height="44" fill="#e8e8e8"/>
  <rect x="16" y="16" width="28" height="28" rx="6" fill="#aaa"/>
  <text x="52" y="36" font-size="15" font-weight="bold" fill="#333">Erudite</text>
  <text x="140" y="35" font-size="13" fill="#555">Courses</text>
  <text x="205" y="35" font-size="13" fill="#555">About Project</text>
  <text x="295" y="35" font-size="13" fill="#555">FAQ</text>

  <!-- Step 1 card: Enter email -->
  <rect x="90" y="80" width="320" height="260" rx="12" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="110" y="115" font-size="11" fill="#aaa">Step 1 of 3</text>
  <text x="110" y="142" font-size="18" font-weight="bold" fill="#222">Forgot password?</text>
  <text x="110" y="162" font-size="11" fill="#888">Enter your email to receive a reset code.</text>
  <text x="110" y="196" font-size="12" fill="#666">Email</text>
  <rect x="110" y="204" width="270" height="40" rx="8" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="126" y="229" font-size="12" fill="#aaa">your@email.com</text>
  <rect x="110" y="264" width="270" height="40" rx="22" fill="#999"/>
  <text x="245" y="289" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">Send reset code</text>
  <text x="245" y="324" font-size="12" fill="#888" text-anchor="middle">← Back to sign in</text>

  <!-- Step 2 card: Enter OTP code -->
  <rect x="490" y="80" width="320" height="280" rx="12" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="510" y="115" font-size="11" fill="#aaa">Step 2 of 3</text>
  <text x="510" y="142" font-size="18" font-weight="bold" fill="#222">Enter reset code</text>
  <text x="510" y="162" font-size="11" fill="#888">Check your email for the 6-digit code.</text>
  <!-- OTP boxes -->
  <rect x="510" y="178" width="40" height="40" rx="6" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <rect x="558" y="178" width="40" height="40" rx="6" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <rect x="606" y="178" width="40" height="40" rx="6" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <rect x="654" y="178" width="40" height="40" rx="6" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <rect x="702" y="178" width="40" height="40" rx="6" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <rect x="750" y="178" width="40" height="40" rx="6" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <rect x="510" y="238" width="280" height="40" rx="22" fill="#999"/>
  <text x="650" y="263" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">Verify code</text>
  <text x="650" y="306" font-size="12" fill="#888" text-anchor="middle" text-decoration="underline">Resend code</text>
  <text x="650" y="326" font-size="12" fill="#888" text-anchor="middle">← Back</text>

  <!-- Step 3 card: New password -->
  <rect x="240" y="380" width="420" height="220" rx="12" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="260" y="415" font-size="11" fill="#aaa">Step 3 of 3</text>
  <text x="260" y="442" font-size="18" font-weight="bold" fill="#222">Set new password</text>
  <text x="260" y="474" font-size="12" fill="#666">New Password</text>
  <rect x="260" y="482" width="180" height="36" rx="6" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="270" y="505" font-size="13" fill="#aaa">• • • • • •</text>
  <text x="460" y="474" font-size="12" fill="#666">Confirm Password</text>
  <rect x="460" y="482" width="180" height="36" rx="6" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="470" y="505" font-size="13" fill="#aaa">• • • • • •</text>
  <rect x="260" y="534" width="380" height="40" rx="22" fill="#999"/>
  <text x="450" y="559" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">Reset password</text>

  <!-- Arrow labels -->
  <text x="450" y="215" font-size="22" fill="#ccc" text-anchor="middle">→</text>
  <text x="450" y="370" font-size="22" fill="#ccc" text-anchor="middle">↓</text>

</svg>
