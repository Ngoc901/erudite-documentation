<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" font-family="Arial, sans-serif">

  <!-- Background -->
  <rect width="900" height="560" fill="#f0f0f0"/>

  <!-- Navbar: dark top strip + light bar -->
  <rect x="0" y="0" width="900" height="8" fill="#c8c8c8"/>
  <rect x="0" y="8" width="900" height="44" fill="#e8e8e8"/>
  <rect x="16" y="16" width="28" height="28" rx="6" fill="#aaa"/>
  <text x="52" y="36" font-size="15" font-weight="bold" fill="#333">Erudite</text>
  <text x="140" y="35" font-size="13" fill="#555">Courses</text>
  <text x="205" y="35" font-size="13" fill="#555">About Project</text>
  <text x="295" y="35" font-size="13" fill="#555">FAQ</text>

  <!-- Card -->
  <rect x="270" y="80" width="360" height="440" rx="12" fill="#fff" stroke="#ddd" stroke-width="1"/>

  <!-- Logo inside card -->
  <rect x="295" y="110" width="20" height="20" rx="4" fill="#bbb"/>
  <text x="322" y="125" font-size="14" font-weight="bold" fill="#444">Erudite</text>

  <!-- Email icon -->
  <rect x="412" y="148" width="76" height="56" rx="8" fill="#e8e8e8"/>
  <text x="450" y="184" font-size="28" fill="#aaa" text-anchor="middle">✉</text>

  <!-- Title -->
  <text x="450" y="232" font-size="20" font-weight="bold" fill="#222" text-anchor="middle">Verify your email</text>
  <text x="450" y="256" font-size="12" fill="#888" text-anchor="middle">We sent a code to your@email.com</text>

  <!-- Code input boxes (6 digits) -->
  <rect x="283" y="276" width="48" height="52" rx="8" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <rect x="339" y="276" width="48" height="52" rx="8" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <rect x="395" y="276" width="48" height="52" rx="8" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <rect x="451" y="276" width="48" height="52" rx="8" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <rect x="507" y="276" width="48" height="52" rx="8" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <rect x="563" y="276" width="48" height="52" rx="8" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="307" y="308" font-size="22" fill="#bbb" text-anchor="middle">-</text>
  <text x="363" y="308" font-size="22" fill="#bbb" text-anchor="middle">-</text>
  <text x="419" y="308" font-size="22" fill="#bbb" text-anchor="middle">-</text>
  <text x="475" y="308" font-size="22" fill="#bbb" text-anchor="middle">-</text>
  <text x="531" y="308" font-size="22" fill="#bbb" text-anchor="middle">-</text>
  <text x="587" y="308" font-size="22" fill="#bbb" text-anchor="middle">-</text>

  <!-- Verify button -->
  <rect x="295" y="354" width="310" height="44" rx="22" fill="#999"/>
  <text x="450" y="381" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Verify email</text>

  <!-- Resend -->
  <text x="450" y="420" font-size="12" fill="#888" text-anchor="middle">Didn't receive the email?</text>
  <text x="450" y="440" font-size="12" fill="#888" text-anchor="middle" text-decoration="underline">Click to resend</text>

  <!-- Back link -->
  <text x="450" y="476" font-size="12" fill="#888" text-anchor="middle">← Back to sign in</text>

</svg>
