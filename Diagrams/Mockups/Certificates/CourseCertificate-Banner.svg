  <rect x="24" y="364" width="912" height="44" rx="8" fill="#fff" stroke="#e8e8e8" stroke-width="1"/>
  <rect x="34" y="374" width="28" height="28" rx="14" fill="#e0e0e0"/>
  <text x="48" y="393" font-size="11" font-weight="bold" fill="#666" text-anchor="middle">03</text>
  <text x="76" y="390" font-size="12" font-weight="bold" fill="#333">String Algorithms</text>
