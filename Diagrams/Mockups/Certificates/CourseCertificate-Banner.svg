  <rect x="76" y="295" width="824" height="3" rx="1" fill="#bbb"/>
  <text x="916" y="288" font-size="11" fill="#aaa" text-anchor="middle">90%</text>

  <rect x="24" y="312" width="912" height="44" rx="8" fill="#fff" stroke="#e8e8e8" stroke-width="1"/>
  <rect x="34" y="322" width="28" height="28" rx="14" fill="#e0e0e0"/>
  <text x="48" y="341" font-size="11" font-weight="bold" fill="#666" text-anchor="middle">02</text>
  <text x="76" y="338" font-size="12" font-weight="bold" fill="#333">Graph Algorithms</text>
  <rect x="360" y="325" width="82" height="18" rx="9" fill="#ebebeb"/>
