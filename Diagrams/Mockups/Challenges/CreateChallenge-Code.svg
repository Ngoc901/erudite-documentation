<svg xmlns="http://www.w3.org/2000/svg" width="960" height="880" font-family="Arial, sans-serif">
  <rect width="960" height="880" fill="#f0f0f0"/>
  <!-- Navbar -->
  <rect x="0" y="0" width="960" height="8" fill="#c8c8c8"/>
  <rect x="0" y="8" width="960" height="44" fill="#e8e8e8"/>
  <rect x="16" y="16" width="28" height="28" rx="6" fill="#aaa"/>
  <text x="52" y="36" font-size="15" font-weight="bold" fill="#333">Erudite</text>
  <text x="140" y="35" font-size="13" fill="#555">Courses</text>
  <text x="205" y="35" font-size="13" fill="#555">About Project</text>
  <text x="295" y="35" font-size="13" fill="#555">FAQ</text>
  <circle cx="930" cy="30" r="16" fill="#bbb"/>
  <circle cx="930" cy="24" r="5" fill="#fff"/>
  <path d="M916,40 Q916,33 930,33 Q944,33 944,40" fill="#fff"/>

  <!-- Modal backdrop -->
  <rect x="0" y="52" width="960" height="828" fill="#e8e8e8" opacity="0.6"/>

  <!-- Dialog box — Code Challenge -->
  <rect x="160" y="60" width="640" height="800" rx="10" fill="#fff" stroke="#ccc" stroke-width="1"/>

  <!-- Header -->
  <rect x="160" y="60" width="640" height="48" rx="10" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1"/>
  <text x="184" y="90" font-size="16" font-weight="bold" fill="#222">New Code Challenge</text>
  <text x="776" y="90" font-size="18" fill="#aaa" text-anchor="middle">×</text>

  <!-- Title -->
  <text x="180" y="132" font-size="12" fill="#666">Title *</text>
  <rect x="180" y="140" width="600" height="34" rx="6" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="196" y="162" font-size="12" fill="#bbb">Challenge title…</text>

  <!-- Problem Statement -->
  <text x="180" y="194" font-size="12" fill="#666">Problem Statement *</text>
  <rect x="180" y="202" width="600" height="60" rx="6" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="196" y="222" font-size="12" fill="#bbb">Describe the problem. LaTeX supported.</text>

  <!-- Language + Difficulty + Points -->
  <text x="180" y="282" font-size="12" fill="#666">Language *</text>
  <rect x="180" y="290" width="160" height="34" rx="6" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="196" y="312" font-size="12" fill="#444">python ▼</text>

  <text x="356" y="282" font-size="12" fill="#666">Difficulty *</text>
  <rect x="356" y="290" width="180" height="34" rx="6" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="372" y="312" font-size="12" fill="#444">medium ▼</text>

  <text x="552" y="282" font-size="12" fill="#666">Points *</text>
  <rect x="552" y="290" width="228" height="34" rx="6" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="568" y="312" font-size="12" fill="#444">20</text>

  <!-- Monaco editor (starter code) -->
  <text x="180" y="344" font-size="12" fill="#666">Starter Code Template</text>
  <rect x="180" y="352" width="600" height="140" rx="6" fill="#2d2d2d"/>
  <rect x="180" y="352" width="600" height="28" rx="6" fill="#252526"/>
  <circle cx="196" cy="366" r="4" fill="#888"/>
  <circle cx="208" cy="366" r="4" fill="#888"/>
  <circle cx="220" cy="366" r="4" fill="#888"/>
  <text x="240" y="370" font-size="10" fill="#aaa">python</text>
  <text x="196" y="402" font-size="11" fill="#c586c0" font-family="monospace">def</text>
  <text x="222" y="402" font-size="11" fill="#dcdcaa" font-family="monospace">solution</text>
  <text x="274" y="402" font-size="11" fill="#d4d4d4" font-family="monospace">(n):</text>
  <text x="196" y="420" font-size="11" fill="#888" font-family="monospace">    # write your code here</text>
  <text x="196" y="438" font-size="11" fill="#c586c0" font-family="monospace">    pass</text>
  <text x="196" y="456" font-size="11" fill="#dcdcaa" font-family="monospace">print</text>
  <text x="236" y="456" font-size="11" fill="#d4d4d4" font-family="monospace">(solution(int(input())))</text>

  <!-- Hint -->
  <text x="180" y="512" font-size="12" fill="#666">Hint (optional)</text>
  <rect x="180" y="520" width="600" height="34" rx="6" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="196" y="542" font-size="12" fill="#bbb">Costs student 50% of points to reveal</text>

  <!-- Test Cases -->
  <text x="180" y="576" font-size="13" font-weight="bold" fill="#444">Test Cases</text>
  <text x="180" y="594" font-size="11" fill="#999">Mark Public so students can see the example, or Hidden to keep it blind.</text>

  <!-- Test 1 -->
  <rect x="180" y="606" width="600" height="74" rx="6" fill="#f9f9f9" stroke="#e0e0e0" stroke-width="1"/>
  <text x="196" y="624" font-size="11" font-weight="bold" fill="#555">Test #1</text>
  <rect x="540" y="612" width="60" height="20" rx="10" fill="#e0e0e0"/>
  <text x="570" y="626" font-size="10" fill="#555" text-anchor="middle">Public</text>
  <rect x="608" y="612" width="60" height="20" rx="4" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="638" y="626" font-size="10" fill="#888" text-anchor="middle">Delete ✕</text>
  <rect x="196" y="632" width="270" height="36" rx="4" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="210" y="646" font-size="10" fill="#999">stdin (input)</text>
  <text x="210" y="660" font-size="11" fill="#444" font-family="monospace">5</text>
  <rect x="476" y="632" width="290" height="36" rx="4" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="490" y="646" font-size="10" fill="#999">expected stdout (output)</text>
  <text x="490" y="660" font-size="11" fill="#444" font-family="monospace">10</text>

  <!-- Test 2 -->
  <rect x="180" y="690" width="600" height="74" rx="6" fill="#f9f9f9" stroke="#e0e0e0" stroke-width="1"/>
  <text x="196" y="708" font-size="11" font-weight="bold" fill="#555">Test #2</text>
  <rect x="540" y="696" width="60" height="20" rx="10" fill="#e0e0e0"/>
  <text x="570" y="710" font-size="10" fill="#555" text-anchor="middle">Hidden</text>
  <rect x="608" y="696" width="60" height="20" rx="4" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="638" y="710" font-size="10" fill="#888" text-anchor="middle">Delete ✕</text>
  <rect x="196" y="716" width="270" height="36" rx="4" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="210" y="730" font-size="10" fill="#999">stdin (input)</text>
  <text x="210" y="744" font-size="11" fill="#444" font-family="monospace">0</text>
  <rect x="476" y="716" width="290" height="36" rx="4" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="490" y="730" font-size="10" fill="#999">expected stdout (output)</text>
  <text x="490" y="744" font-size="11" fill="#444" font-family="monospace">0</text>

  <!-- Add test case -->
  <rect x="180" y="774" width="140" height="28" rx="6" fill="#f0f0f0" stroke="#ddd" stroke-width="1"/>
  <text x="250" y="792" font-size="12" fill="#666" text-anchor="middle">+ Add Test Case</text>

  <!-- Footer -->
  <line x1="160" y1="814" x2="800" y2="814" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="576" y="822" width="80" height="30" rx="6" fill="#ddd"/>
  <text x="616" y="841" font-size="12" fill="#555" text-anchor="middle">Cancel</text>
  <rect x="666" y="822" width="114" height="30" rx="6" fill="#888"/>
  <text x="723" y="841" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Create</text>
</svg>
