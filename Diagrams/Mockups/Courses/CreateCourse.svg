<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" font-family="Arial, sans-serif">
  <rect width="960" height="700" fill="#f0f0f0"/>
  <!-- Navbar -->
  <rect x="0" y="0" width="960" height="8" fill="#c8c8c8"/>
  <rect x="0" y="8" width="960" height="44" fill="#e8e8e8"/>
  <rect x="16" y="16" width="28" height="28" rx="6" fill="#aaa"/>
  <text x="52" y="36" font-size="15" font-weight="bold" fill="#333">Erudite</text>
  <text x="140" y="35" font-size="13" fill="#555">Courses</text>
  <text x="205" y="35" font-size="13" fill="#555">About Project</text>
  <text x="295" y="35" font-size="13" fill="#555">FAQ</text>
  <circle cx="930" cy="30" r="16" fill="#bbb"/>
  <circle cx="930" cy="24" r="5" fill="#fff"/>
  <path d="M916,40 Q916,33 930,33 Q944,33 944,40" fill="#fff"/>

  <!-- Modal backdrop -->
  <rect x="0" y="52" width="960" height="648" fill="#e8e8e8" opacity="0.6"/>

  <!-- Dialog -->
  <rect x="200" y="64" width="560" height="614" rx="10" fill="#fff" stroke="#ccc" stroke-width="1"/>

  <!-- Header -->
  <rect x="200" y="64" width="560" height="48" rx="10" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1"/>
  <text x="220" y="94" font-size="16" font-weight="bold" fill="#222">Create New Course</text>
  <text x="736" y="94" font-size="18" fill="#aaa" text-anchor="middle">×</text>

  <!-- Level -->
  <text x="220" y="136" font-size="12" fill="#666">Level *</text>
  <rect x="220" y="144" width="520" height="34" rx="6" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="236" y="166" font-size="12" fill="#444">beginner ▼</text>

  <!-- Title -->
  <text x="220" y="200" font-size="12" fill="#666">Title *</text>
  <rect x="220" y="208" width="520" height="34" rx="6" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="236" y="230" font-size="12" fill="#bbb">Course title…</text>

  <!-- Featured image -->
  <text x="220" y="264" font-size="12" fill="#666">Featured Image (optional)</text>
  <rect x="220" y="272" width="520" height="60" rx="6" fill="#f5f5f5" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="480" y="296" font-size="12" fill="#bbb" text-anchor="middle">Upload image (JPEG/PNG, max 5MB)</text>
  <rect x="380" y="304" width="200" height="22" rx="6" fill="#e8e8e8" stroke="#ccc" stroke-width="1"/>
  <text x="480" y="319" font-size="11" fill="#666" text-anchor="middle">Choose file…</text>

  <!-- Description -->
  <text x="220" y="354" font-size="12" fill="#666">Description *</text>
  <rect x="220" y="362" width="520" height="80" rx="6" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="236" y="382" font-size="12" fill="#bbb">Describe the course content and goals…</text>

  <!-- Status -->
  <text x="220" y="464" font-size="12" fill="#666">Status *</text>
  <rect x="220" y="472" width="520" height="34" rx="6" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="236" y="494" font-size="12" fill="#444">draft ▼</text>

  <!-- Completion threshold -->
  <text x="220" y="528" font-size="12" fill="#666">Completion Threshold (%)</text>
  <rect x="220" y="536" width="520" height="34" rx="6" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="236" y="558" font-size="12" fill="#444">80</text>

  <!-- Footer -->
  <line x1="200" y1="588" x2="760" y2="588" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="566" y="598" width="80" height="32" rx="6" fill="#ddd"/>
  <text x="606" y="618" font-size="12" fill="#555" text-anchor="middle">Cancel</text>
  <rect x="656" y="598" width="84" height="32" rx="6" fill="#888"/>
  <text x="698" y="618" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Create</text>
</svg>
