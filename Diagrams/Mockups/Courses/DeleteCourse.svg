<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" font-family="Arial, sans-serif">
  <rect width="960" height="320" fill="#f0f0f0"/>
  <!-- Navbar -->
  <rect x="0" y="0" width="960" height="8" fill="#c8c8c8"/>
  <rect x="0" y="8" width="960" height="44" fill="#e8e8e8"/>
  <rect x="16" y="16" width="28" height="28" rx="6" fill="#aaa"/>
  <text x="52" y="36" font-size="15" font-weight="bold" fill="#333">Erudite</text>
  <text x="140" y="35" font-size="13" fill="#555">Courses</text>
  <text x="205" y="35" font-size="13" fill="#555">About Project</text>
  <text x="295" y="35" font-size="13" fill="#555">FAQ</text>
  <circle cx="930" cy="30" r="16" fill="#bbb"/>
  <circle cx="930" cy="24" r="5" fill="#fff"/>
  <path d="M916,40 Q916,33 930,33 Q944,33 944,40" fill="#fff"/>

  <!-- Modal backdrop -->
  <rect x="0" y="52" width="960" height="268" fill="#e8e8e8" opacity="0.6"/>

  <!-- Confirm dialog -->
  <rect x="300" y="88" width="360" height="196" rx="10" fill="#fff" stroke="#ccc" stroke-width="1"/>

  <!-- Header -->
  <rect x="300" y="88" width="360" height="44" rx="10" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1"/>
  <text x="320" y="115" font-size="15" font-weight="bold" fill="#222">Delete course?</text>
  <text x="636" y="115" font-size="18" fill="#aaa" text-anchor="middle">×</text>

  <!-- Body -->
  <text x="320" y="154" font-size="12" fill="#555">This will permanently delete</text>
  <text x="320" y="172" font-size="12" font-weight="bold" fill="#333">"Python for Beginners"</text>
  <text x="320" y="190" font-size="12" fill="#555">and all its topics and challenges.</text>
  <text x="320" y="208" font-size="12" fill="#888">This cannot be undone.</text>

  <!-- Footer -->
  <line x1="300" y1="226" x2="660" y2="226" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="404" y="236" width="80" height="28" rx="6" fill="#ddd"/>
  <text x="444" y="254" font-size="12" fill="#555" text-anchor="middle">Cancel</text>
  <rect x="494" y="236" width="100" height="28" rx="6" fill="#cc4444"/>
  <text x="544" y="254" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Delete</text>
</svg>
