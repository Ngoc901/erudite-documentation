<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" font-family="Arial, sans-serif">
  <rect width="960" height="700" fill="#f0f0f0"/>
  <!-- Navbar -->
  <rect x="0" y="0" width="960" height="8" fill="#c8c8c8"/>
  <rect x="0" y="8" width="960" height="44" fill="#e8e8e8"/>
  <rect x="16" y="16" width="28" height="28" rx="6" fill="#aaa"/>
  <text x="52" y="36" font-size="15" font-weight="bold" fill="#333">Erudite</text>
  <text x="140" y="35" font-size="13" fill="#555">Courses</text>
  <text x="205" y="35" font-size="13" fill="#555">About Project</text>
  <text x="295" y="35" font-size="13" fill="#555">FAQ</text>
  <circle cx="930" cy="30" r="16" fill="#bbb"/>
  <circle cx="930" cy="24" r="5" fill="#fff"/>
  <path d="M916,40 Q916,33 930,33 Q944,33 944,40" fill="#fff"/>

  <!-- Modal backdrop -->
  <rect x="0" y="52" width="960" height="648" fill="#e8e8e8" opacity="0.6"/>

  <!-- Dialog -->
  <rect x="200" y="64" width="560" height="614" rx="10" fill="#fff" stroke="#ccc" stroke-width="1"/>

  <!-- Header -->
  <rect x="200" y="64" width="560" height="48" rx="10" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1"/>
  <text x="220" y="94" font-size="16" font-weight="bold" fill="#222">Edit Course</text>
  <text x="736" y="94" font-size="18" fill="#aaa" text-anchor="middle">×</text>

  <!-- Level -->
  <text x="220" y="136" font-size="12" fill="#666">Level *</text>
  <rect x="220" y="144" width="520" height="34" rx="6" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="236" y="166" font-size="12" fill="#444">beginner ▼</text>

  <!-- Title -->
  <text x="220" y="200" font-size="12" fill="#666">Title *</text>
  <rect x="220" y="208" width="520" height="34" rx="6" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="236" y="230" font-size="12" fill="#444">Python for Beginners</text>

  <!-- Featured image -->
  <text x="220" y="264" font-size="12" fill="#666">Featured Image</text>
  <rect x="220" y="272" width="520" height="50" rx="6" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <rect x="228" y="280" width="60" height="34" rx="4" fill="#ddd"/>
  <text x="258" y="301" font-size="9" fill="#888" text-anchor="middle">preview</text>
  <text x="302" y="296" font-size="11" fill="#555">python-course.jpg</text>
  <rect x="660" y="280" width="70" height="22" rx="4" fill="#e8e8e8" stroke="#ccc" stroke-width="1"/>
  <text x="695" y="295" font-size="10" fill="#666" text-anchor="middle">Remove</text>

  <!-- Description -->
  <text x="220" y="344" font-size="12" fill="#666">Description *</text>
  <rect x="220" y="352" width="520" height="80" rx="6" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="236" y="372" font-size="12" fill="#444">A comprehensive introduction to Python programming</text>
  <text x="236" y="390" font-size="12" fill="#444">covering variables, control flow, and functions.</text>

  <!-- Status -->
  <text x="220" y="454" font-size="12" fill="#666">Status *</text>
  <rect x="220" y="462" width="520" height="34" rx="6" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="236" y="484" font-size="12" fill="#444">published ▼</text>

  <!-- Completion threshold -->
  <text x="220" y="518" font-size="12" fill="#666">Completion Threshold (%)</text>
  <rect x="220" y="526" width="520" height="34" rx="6" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="236" y="548" font-size="12" fill="#444">80</text>

  <!-- Footer -->
  <line x1="200" y1="578" x2="760" y2="578" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="566" y="588" width="80" height="32" rx="6" fill="#ddd"/>
  <text x="606" y="608" font-size="12" fill="#555" text-anchor="middle">Cancel</text>
  <rect x="656" y="588" width="84" height="32" rx="6" fill="#888"/>
  <text x="698" y="608" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Save</text>
</svg>
