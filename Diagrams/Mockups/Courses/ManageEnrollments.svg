<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" font-family="Arial, sans-serif">
  <rect width="960" height="580" fill="#f0f0f0"/>
  <!-- Navbar -->
  <rect x="0" y="0" width="960" height="8" fill="#c8c8c8"/>
  <rect x="0" y="8" width="960" height="44" fill="#e8e8e8"/>
  <rect x="16" y="16" width="28" height="28" rx="6" fill="#aaa"/>
  <text x="52" y="36" font-size="15" font-weight="bold" fill="#333">Erudite</text>
  <text x="140" y="35" font-size="13" fill="#555">Courses</text>
  <text x="205" y="35" font-size="13" fill="#555">About Project</text>
  <text x="295" y="35" font-size="13" fill="#555">FAQ</text>
  <circle cx="930" cy="30" r="16" fill="#bbb"/>
  <circle cx="930" cy="24" r="5" fill="#fff"/>
  <path d="M916,40 Q916,33 930,33 Q944,33 944,40" fill="#fff"/>

  <!-- Enrollment panel card -->
  <rect x="24" y="64" width="912" height="500" rx="8" fill="#fff" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Section title -->
  <text x="40" y="96" font-size="16" font-weight="bold" fill="#222">Enrolled Students</text>
  <rect x="220" y="82" width="28" height="22" rx="11" fill="#e8e8e8"/>
  <text x="234" y="97" font-size="11" fill="#666" text-anchor="middle">3</text>

  <!-- LTI token box -->
  <rect x="40" y="110" width="880" height="52" rx="6" fill="#f0f4ff" stroke="#c8d8f0" stroke-width="1"/>
  <text x="56" y="130" font-size="11" font-weight="bold" fill="#555">Moodle LTI Token</text>
  <text x="56" y="148" font-size="11" fill="#666" font-family="monospace">a3f7c2e1-9b4d-4e8a-b1c2-d3e4f5a6b7c8</text>
  <rect x="832" y="118" width="76" height="26" rx="6" fill="#e8e8e8" stroke="#ccc" stroke-width="1"/>
  <text x="870" y="135" font-size="11" fill="#555" text-anchor="middle">⎘ Copy</text>

  <!-- Add student row -->
  <rect x="40" y="178" width="720" height="34" rx="6" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="56" y="199" font-size="12" fill="#bbb">Add student by username…</text>
  <rect x="772" y="178" width="148" height="34" rx="6" fill="#888"/>
  <text x="846" y="199" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">+ Add Student</text>

  <!-- Divider -->
  <line x1="40" y1="228" x2="920" y2="228" stroke="#eee" stroke-width="1"/>

  <!-- Student row 1 -->
  <circle cx="60" cy="256" r="14" fill="#ddd"/>
  <circle cx="60" cy="250" r="5" fill="#bbb"/>
  <path d="M48,264 Q48,258 60,258 Q72,258 72,264" fill="#bbb"/>
  <text x="84" y="253" font-size="13" font-weight="bold" fill="#333">student_alice</text>
  <rect x="84" y="258" width="60" height="16" rx="8" fill="#e8e8e8"/>
  <text x="114" y="270" font-size="10" fill="#666" text-anchor="middle">Moodle</text>
  <text x="680" y="261" font-size="11" fill="#aaa">Enrolled Apr 27, 2024</text>
  <rect x="864" y="246" width="42" height="22" rx="4" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="885" y="261" font-size="13" fill="#aaa" text-anchor="middle">✕</text>

  <!-- Student row 2 -->
  <line x1="40" y1="282" x2="920" y2="282" stroke="#f5f5f5" stroke-width="1"/>
  <circle cx="60" cy="304" r="14" fill="#ddd"/>
  <circle cx="60" cy="298" r="5" fill="#bbb"/>
  <path d="M48,312 Q48,306 60,306 Q72,306 72,312" fill="#bbb"/>
  <text x="84" y="301" font-size="13" font-weight="bold" fill="#333">student_bob</text>
  <text x="680" y="309" font-size="11" fill="#aaa">Enrolled May 3, 2024</text>
  <rect x="864" y="294" width="42" height="22" rx="4" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="885" y="309" font-size="13" fill="#aaa" text-anchor="middle">✕</text>

  <!-- Student row 3 -->
  <line x1="40" y1="330" x2="920" y2="330" stroke="#f5f5f5" stroke-width="1"/>
  <circle cx="60" cy="352" r="14" fill="#ddd"/>
  <circle cx="60" cy="346" r="5" fill="#bbb"/>
  <path d="M48,360 Q48,354 60,354 Q72,354 72,360" fill="#bbb"/>
  <text x="84" y="349" font-size="13" font-weight="bold" fill="#333">student_carol</text>
  <text x="680" y="357" font-size="11" fill="#aaa">Enrolled May 10, 2024</text>
  <rect x="864" y="342" width="42" height="22" rx="4" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="885" y="357" font-size="13" fill="#aaa" text-anchor="middle">✕</text>

  <!-- Empty area note -->
  <line x1="40" y1="378" x2="920" y2="378" stroke="#eee" stroke-width="1"/>
  <text x="480" y="440" font-size="12" fill="#ccc" text-anchor="middle">Add more students using the field above</text>
</svg>
