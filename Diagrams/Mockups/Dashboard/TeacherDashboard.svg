  <circle cx="748" cy="422" r="5" fill="#aaa"/>
  <text x="758" y="426" font-size="10" fill="#888">passed</text>
  <circle cx="804" cy="422" r="5" fill="#ccc"/>
  <text x="814" y="426" font-size="10" fill="#888">failed</text>
  <circle cx="852" cy="422" r="5" fill="#e8e8e8" stroke="#ccc" stroke-width="1"/>
  <text x="862" y="426" font-size="10" fill="#888">not attempted</text>

  <!-- Course panel 2 (collapsed) -->
  <rect x="24" y="462" width="912" height="44" rx="8" fill="#fff" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="40" y="472" width="44" height="24" rx="4" fill="#ddd"/>
  <text x="62" y="488" font-size="9" fill="#888" text-anchor="middle">img</text>
  <text x="96" y="487" font-size="14" font-weight="bold" fill="#222">Algorithms 101</text>
