  <line x1="40" y1="358" x2="920" y2="358" stroke="#f5f5f5" stroke-width="1"/>
  <circle cx="56" cy="376" r="12" fill="#ddd"/>
  <text x="78" y="379" font-size="12" fill="#333">student_dave</text>
  <rect x="240" y="370" width="160" height="6" rx="3" fill="#e0e0e0"/>
