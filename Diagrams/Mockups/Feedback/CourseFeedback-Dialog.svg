<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" font-family="Arial, sans-serif">
  <rect width="960" height="440" fill="#f0f0f0"/>
  <!-- Navbar -->
  <rect x="0" y="0" width="960" height="8" fill="#c8c8c8"/>
  <rect x="0" y="8" width="960" height="44" fill="#e8e8e8"/>
  <rect x="16" y="16" width="28" height="28" rx="6" fill="#aaa"/>
  <text x="52" y="36" font-size="15" font-weight="bold" fill="#333">Erudite</text>
  <text x="140" y="35" font-size="13" fill="#555">Courses</text>
  <text x="205" y="35" font-size="13" fill="#555">About Project</text>
  <text x="295" y="35" font-size="13" fill="#555">FAQ</text>
  <circle cx="930" cy="30" r="16" fill="#bbb"/>
  <circle cx="930" cy="24" r="5" fill="#fff"/>
  <path d="M916,40 Q916,33 930,33 Q944,33 944,40" fill="#fff"/>

  <!-- Modal backdrop -->
  <rect x="0" y="52" width="960" height="388" fill="#e8e8e8" opacity="0.6"/>

  <!-- Dialog -->
  <rect x="240" y="68" width="480" height="346" rx="10" fill="#fff" stroke="#ccc" stroke-width="1"/>

  <!-- Header -->
  <rect x="240" y="68" width="480" height="48" rx="10" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1"/>
  <text x="260" y="98" font-size="16" font-weight="bold" fill="#222">Write a review</text>
  <text x="696" y="98" font-size="18" fill="#aaa" text-anchor="middle">×</text>

  <!-- Star rating selector -->
  <text x="260" y="138" font-size="12" fill="#666">Your rating *</text>
  <text x="260" y="170" font-size="32" fill="#aaa" letter-spacing="4">★★★★★</text>
  <text x="260" y="190" font-size="11" fill="#bbb">Tap a star to select your rating</text>

  <!-- Comment -->
  <text x="260" y="216" font-size="12" fill="#666">Comment (optional)</text>
  <rect x="260" y="224" width="400" height="80" rx="6" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="276" y="244" font-size="12" fill="#bbb">Share your experience with this course…</text>

  <!-- Footer -->
  <line x1="240" y1="322" x2="720" y2="322" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="486" y="332" width="80" height="32" rx="6" fill="#ddd"/>
  <text x="526" y="352" font-size="12" fill="#555" text-anchor="middle">Cancel</text>
  <rect x="576" y="332" width="84" height="32" rx="6" fill="#888"/>
  <text x="618" y="352" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Submit</text>
</svg>
