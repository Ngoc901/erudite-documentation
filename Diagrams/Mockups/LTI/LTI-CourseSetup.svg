  <text x="295" y="35" font-size="13" fill="#555">FAQ</text>
  <circle cx="930" cy="30" r="16" fill="#bbb"/>
  <circle cx="930" cy="24" r="5" fill="#fff"/>
  <path d="M916,40 Q916,33 930,33 Q944,33 944,40" fill="#fff"/>

  <!-- Course detail context -->
  <rect x="24" y="64" width="912" height="496" rx="8" fill="#fff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="40" y="94" font-size="18" font-weight="bold" fill="#222">Python for Beginners</text>
  <rect x="40" y="100" width="60" height="18" rx="9" fill="#e8e8e8"/>
  <text x="70" y="113" font-size="10" fill="#555" text-anchor="middle">private</text>
  <line x1="40" y1="126" x2="920" y2="126" stroke="#eee" stroke-width="1"/>

  <!-- Enrollment panel -->
  <text x="40" y="152" font-size="15" font-weight="bold" fill="#333">Enrolled Students</text>
  <rect x="220" y="138" width="28" height="22" rx="11" fill="#e8e8e8"/>
  <text x="234" y="153" font-size="11" fill="#666" text-anchor="middle">3</text>

  <!-- LTI token section -->
  <rect x="40" y="164" width="880" height="64" rx="6" fill="#f0f4ff" stroke="#c8d8f0" stroke-width="1"/>
  <text x="56" y="184" font-size="12" font-weight="bold" fill="#555">Moodle LTI Token</text>
  <text x="56" y="202" font-size="11" fill="#555" font-family="monospace">a3f7c2e1-9b4d-4e8a-b1c2-d3e4f5a6b7c8</text>
  <rect x="808" y="174" width="100" height="26" rx="6" fill="#e8e8e8" stroke="#ccc" stroke-width="1"/>
  <text x="858" y="191" font-size="11" fill="#555" text-anchor="middle">⎘ Copy token</text>
  <text x="56" y="218" font-size="10" fill="#aaa">Paste in Moodle custom parameters as  course=&lt;token&gt;</text>

  <!-- Add student -->
  <rect x="40" y="242" width="720" height="34" rx="6" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="56" y="263" font-size="12" fill="#bbb">Add student by username…</text>
  <rect x="772" y="242" width="148" height="34" rx="6" fill="#888"/>
  <text x="846" y="263" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">+ Add Student</text>

  <line x1="40" y1="292" x2="920" y2="292" stroke="#eee" stroke-width="1"/>

  <!-- Student rows -->
  <circle cx="60" cy="318" r="14" fill="#ddd"/>
  <circle cx="60" cy="312" r="5" fill="#bbb"/>
  <path d="M48,326 Q48,320 60,320 Q72,320 72,326" fill="#bbb"/>
  <text x="84" y="315" font-size="13" font-weight="bold" fill="#333">student_alice</text>
  <rect x="84" y="320" width="62" height="16" rx="8" fill="#e8e8e8"/>
  <text x="115" y="332" font-size="9" fill="#666" text-anchor="middle">Moodle</text>
  <text x="680" y="323" font-size="11" fill="#aaa">Enrolled via LTI  ·  Apr 27, 2024</text>
  <rect x="874" y="308" width="42" height="22" rx="4" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="895" y="323" font-size="13" fill="#aaa" text-anchor="middle">✕</text>

  <line x1="40" y1="342" x2="920" y2="342" stroke="#f5f5f5" stroke-width="1"/>
  <circle cx="60" cy="368" r="14" fill="#ddd"/>
  <circle cx="60" cy="362" r="5" fill="#bbb"/>
  <path d="M48,376 Q48,370 60,370 Q72,370 72,376" fill="#bbb"/>
  <text x="84" y="365" font-size="13" font-weight="bold" fill="#333">student_bob</text>
  <rect x="84" y="370" width="62" height="16" rx="8" fill="#e8e8e8"/>
  <text x="115" y="382" font-size="9" fill="#666" text-anchor="middle">Moodle</text>
  <text x="680" y="373" font-size="11" fill="#aaa">Enrolled via LTI  ·  May 3, 2024</text>
  <rect x="874" y="358" width="42" height="22" rx="4" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="895" y="373" font-size="13" fill="#aaa" text-anchor="middle">✕</text>

  <line x1="40" y1="392" x2="920" y2="392" stroke="#f5f5f5" stroke-width="1"/>
  <circle cx="60" cy="418" r="14" fill="#ddd"/>
  <circle cx="60" cy="412" r="5" fill="#bbb"/>
  <path d="M48,426 Q48,420 60,420 Q72,420 72,426" fill="#bbb"/>
  <text x="84" y="415" font-size="13" font-weight="bold" fill="#333">student_carol</text>
  <text x="680" y="423" font-size="11" fill="#aaa">Enrolled manually  ·  May 10, 2024</text>
  <rect x="874" y="408" width="42" height="22" rx="4" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="895" y="423" font-size="13" fill="#aaa" text-anchor="middle">✕</text>

  <!-- Grade passback note -->
  <line x1="40" y1="448" x2="920" y2="448" stroke="#eee" stroke-width="1"/>
  <rect x="40" y="460" width="880" height="44" rx="6" fill="#f9f9f9" stroke="#e8e8e8" stroke-width="1"/>
  <text x="56" y="480" font-size="12" fill="#888">Grade passback enabled — student scores are automatically sent back to Moodle gradebook on submission.</text>
  <text x="56" y="496" font-size="11" fill="#bbb">Requires LTI session with AGS endpoint.</text>
</svg>
