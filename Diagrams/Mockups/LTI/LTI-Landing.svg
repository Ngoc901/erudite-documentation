<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" font-family="Arial, sans-serif">
  <rect width="960" height="340" fill="#f0f0f0"/>
  <!-- Navbar -->
  <rect x="0" y="0" width="960" height="8" fill="#c8c8c8"/>
  <rect x="0" y="8" width="960" height="44" fill="#e8e8e8"/>
  <rect x="16" y="16" width="28" height="28" rx="6" fill="#aaa"/>
  <text x="52" y="36" font-size="15" font-weight="bold" fill="#333">Erudite</text>
  <text x="140" y="35" font-size="13" fill="#555">Courses</text>
  <text x="205" y="35" font-size="13" fill="#555">About Project</text>
  <text x="295" y="35" font-size="13" fill="#555">FAQ</text>

  <!-- Landing card -->
  <rect x="330" y="84" width="300" height="200" rx="10" fill="#fff" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Spinner placeholder -->
  <circle cx="480" cy="152" r="28" fill="none" stroke="#ddd" stroke-width="4"/>
  <path d="M480,124 A28,28 0 0,1 508,152" fill="none" stroke="#888" stroke-width="4" stroke-linecap="round"/>

  <!-- Text -->
  <text x="480" y="208" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">Signing you in via Moodle…</text>
  <text x="480" y="228" font-size="12" fill="#aaa" text-anchor="middle">You will be redirected shortly</text>

  <!-- Moodle badge -->
  <rect x="398" y="248" width="164" height="24" rx="12" fill="#f0f0f0" stroke="#ddd" stroke-width="1"/>
  <text x="480" y="264" font-size="11" fill="#888" text-anchor="middle">Moodle LTI 1.3</text>
</svg>
