<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" font-family="Arial, sans-serif">
  <rect width="960" height="600" fill="#f0f0f0"/>
  <!-- Navbar -->
  <rect x="0" y="0" width="960" height="8" fill="#c8c8c8"/>
  <rect x="0" y="8" width="960" height="44" fill="#e8e8e8"/>
  <rect x="16" y="16" width="28" height="28" rx="6" fill="#aaa"/>
  <text x="52" y="36" font-size="15" font-weight="bold" fill="#333">Erudite</text>
  <text x="140" y="35" font-size="13" fill="#555">Courses</text>
  <text x="205" y="35" font-size="13" fill="#555">About Project</text>
  <text x="295" y="35" font-size="13" fill="#555">FAQ</text>
  <circle cx="930" cy="30" r="16" fill="#bbb"/>
  <circle cx="930" cy="24" r="5" fill="#fff"/>
  <path d="M916,40 Q916,33 930,33 Q944,33 944,40" fill="#fff"/>

  <!-- Lesson card -->
  <rect x="24" y="64" width="912" height="516" rx="8" fill="#fff" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Lesson header -->
  <rect x="40" y="80" width="36" height="36" rx="6" fill="#ddd"/>
  <text x="58" y="103" font-size="16" fill="#888" text-anchor="middle"></text>
  <text x="88" y="96" font-size="17" font-weight="bold" fill="#222">Introduction to Python</text>
  <rect x="88" y="102" width="38" height="18" rx="9" fill="#e8e8e8"/>
  <text x="107" y="115" font-size="10" fill="#666" text-anchor="middle">text</text>
  <rect x="134" y="102" width="70" height="18" rx="9" fill="#e8e8e8"/>
  <text x="169" y="115" font-size="10" fill="#888" text-anchor="middle">⏱ 10 min</text>

  <!-- Teacher toolbar -->
  <rect x="842" y="84" width="28" height="28" rx="6" fill="none" stroke="#ddd" stroke-width="1"/>
  <text x="856" y="102" font-size="13" fill="#aaa" text-anchor="middle">✎</text>
  <rect x="878" y="84" width="28" height="28" rx="6" fill="none" stroke="#ddd" stroke-width="1"/>
  <text x="892" y="102" font-size="13" fill="#aaa" text-anchor="middle">Delete</text>

  <line x1="40" y1="128" x2="920" y2="128" stroke="#eee" stroke-width="1"/>

  <!-- Lesson photo -->
  <rect x="40" y="140" width="880" height="140" rx="6" fill="#ddd"/>
  <text x="480" y="217" font-size="13" fill="#aaa" text-anchor="middle">[ lesson image ]</text>

  <!-- Lesson content (markdown rendered) -->
  <text x="40" y="306" font-size="14" font-weight="bold" fill="#222">What is Python?</text>
  <text x="40" y="328" font-size="12" fill="#444">Python is a high-level, interpreted programming language known for its simplicity and readability.</text>
  <text x="40" y="346" font-size="12" fill="#444">It supports multiple programming paradigms including procedural, object-oriented, and functional.</text>

  <text x="40" y="376" font-size="13" font-weight="bold" fill="#333">Key Features</text>
  <text x="56" y="396" font-size="12" fill="#555">•  Easy-to-read syntax</text>
  <text x="56" y="414" font-size="12" fill="#555">•  Dynamically typed</text>
  <text x="56" y="432" font-size="12" fill="#555">•  Large standard library</text>
  <text x="56" y="450" font-size="12" fill="#555">•  Cross-platform</text>

  <!-- Code block -->
  <rect x="40" y="466" width="880" height="80" rx="6" fill="#2d2d2d"/>
  <text x="56" y="490" font-size="11" fill="#c586c0" font-family="monospace">print</text>
  <text x="95" y="490" font-size="11" fill="#d4d4d4" font-family="monospace">("Hello, World!")</text>
  <text x="56" y="510" font-size="11" fill="#888" font-family="monospace"># Output: Hello, World!</text>
  <text x="56" y="530" font-size="11" fill="#9cdcfe" font-family="monospace">x = 42</text>
</svg>
