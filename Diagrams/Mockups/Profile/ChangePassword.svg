<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" font-family="Arial, sans-serif">
  <rect width="960" height="520" fill="#f0f0f0"/>
  <!-- Navbar -->
  <rect x="0" y="0" width="960" height="8" fill="#c8c8c8"/>
  <rect x="0" y="8" width="960" height="44" fill="#e8e8e8"/>
  <rect x="16" y="16" width="28" height="28" rx="6" fill="#aaa"/>
  <text x="52" y="36" font-size="15" font-weight="bold" fill="#333">Erudite</text>
  <text x="140" y="35" font-size="13" fill="#555">Courses</text>
  <text x="205" y="35" font-size="13" fill="#555">About Project</text>
  <text x="295" y="35" font-size="13" fill="#555">FAQ</text>
  <circle cx="930" cy="30" r="16" fill="#bbb"/>
  <circle cx="930" cy="24" r="5" fill="#fff"/>
  <path d="M916,40 Q916,33 930,33 Q944,33 944,40" fill="#fff"/>

  <!-- Modal backdrop -->
  <rect x="0" y="0" width="960" height="520" fill="#000" opacity="0.18"/>

  <!-- Dialog -->
  <rect x="280" y="60" width="400" height="392" rx="10" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <!-- Dialog header -->
  <rect x="280" y="60" width="400" height="44" rx="10" fill="#e8e8e8"/>
  <rect x="280" y="84" width="400" height="20" fill="#e8e8e8"/>
  <text x="480" y="88" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">Change Password</text>

  <!-- Step description -->
  <text x="300" y="126" font-size="12" fill="#888">Enter your email to receive a one-time code.</text>

  <!-- Email field -->
  <text x="300" y="154" font-size="12" fill="#555">Email</text>
  <rect x="300" y="160" width="360" height="32" rx="4" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1"/>
  <text x="312" y="180" font-size="12" fill="#aaa">alice@example.com</text>

  <!-- Send OTP button -->
  <rect x="300" y="204" width="360" height="32" rx="6" fill="#888"/>
  <text x="480" y="224" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Send OTP</text>

  <line x1="300" y1="250" x2="660" y2="250" stroke="#f0f0f0" stroke-width="1"/>
  <text x="480" y="270" font-size="11" fill="#bbb" text-anchor="middle">Enter code sent to your email</text>

  <!-- OTP field -->
  <text x="300" y="298" font-size="12" fill="#555">OTP Code</text>
  <rect x="300" y="304" width="360" height="32" rx="4" fill="#f9f9f9" stroke="#ddd" stroke-width="1"/>
  <text x="312" y="324" font-size="12" fill="#bbb">6-digit code</text>

  <!-- New password field -->
  <text x="300" y="352" font-size="12" fill="#555">New Password</text>
  <rect x="300" y="358" width="360" height="32" rx="4" fill="#f9f9f9" stroke="#ddd" stroke-width="1"/>
  <text x="312" y="378" font-size="12" fill="#bbb">Enter new password</text>

  <!-- Footer -->
  <line x1="280" y1="406" x2="680" y2="406" stroke="#eee" stroke-width="1"/>
  <rect x="300" y="418" width="80" height="32" rx="6" fill="#f0f0f0" stroke="#ddd" stroke-width="1"/>
  <text x="340" y="438" font-size="12" fill="#555" text-anchor="middle">Cancel</text>
  <rect x="568" y="418" width="92" height="32" rx="6" fill="#888"/>
  <text x="614" y="438" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Confirm</text>
</svg>
