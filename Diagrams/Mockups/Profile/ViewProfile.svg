  <rect x="304" y="326" width="120" height="52" rx="6" fill="#f5f5f5" stroke="#eee" stroke-width="1"/>
  <text x="364" y="346" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">3</text>
