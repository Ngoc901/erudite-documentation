<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" font-family="Arial, sans-serif">
  <rect width="960" height="480" fill="#f0f0f0"/>
  <!-- Navbar -->
  <rect x="0" y="0" width="960" height="8" fill="#c8c8c8"/>
  <rect x="0" y="8" width="960" height="44" fill="#e8e8e8"/>
  <rect x="16" y="16" width="28" height="28" rx="6" fill="#aaa"/>
  <text x="52" y="36" font-size="15" font-weight="bold" fill="#333">Erudite</text>
  <text x="140" y="35" font-size="13" fill="#555">Courses</text>
  <text x="205" y="35" font-size="13" fill="#555">About Project</text>
  <text x="295" y="35" font-size="13" fill="#555">FAQ</text>
  <circle cx="930" cy="30" r="16" fill="#bbb"/>
  <circle cx="930" cy="24" r="5" fill="#fff"/>
  <path d="M916,40 Q916,33 930,33 Q944,33 944,40" fill="#fff"/>

  <!-- Modal backdrop -->
  <rect width="960" height="480" fill="rgba(0,0,0,0)" opacity="0.3"/>
  <rect x="0" y="0" width="960" height="480" fill="#000" opacity="0.18"/>

  <!-- Dialog -->
  <rect x="280" y="60" width="400" height="352" rx="10" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <!-- Dialog header -->
  <rect x="280" y="60" width="400" height="44" rx="10" fill="#e8e8e8"/>
  <rect x="280" y="84" width="400" height="20" fill="#e8e8e8"/>
  <text x="480" y="88" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">Add Topic</text>

  <!-- Title field -->
  <text x="300" y="128" font-size="12" fill="#555">Title *</text>
  <rect x="300" y="134" width="360" height="32" rx="4" fill="#f9f9f9" stroke="#ddd" stroke-width="1"/>
  <text x="312" y="154" font-size="12" fill="#bbb">e.g. Introduction to Python</text>

  <!-- Description field -->
  <text x="300" y="186" font-size="12" fill="#555">Description</text>
  <rect x="300" y="192" width="360" height="72" rx="4" fill="#f9f9f9" stroke="#ddd" stroke-width="1"/>
  <text x="312" y="212" font-size="12" fill="#bbb">Optional description…</text>

  <!-- Sort order field -->
  <text x="300" y="282" font-size="12" fill="#555">Sort Order</text>
  <rect x="300" y="288" width="160" height="32" rx="4" fill="#f9f9f9" stroke="#ddd" stroke-width="1"/>
  <text x="312" y="308" font-size="12" fill="#bbb">Auto</text>
  <text x="468" y="308" font-size="11" fill="#aaa">(leave blank to auto-assign)</text>

  <!-- Footer -->
  <line x1="280" y1="338" x2="680" y2="338" stroke="#eee" stroke-width="1"/>
  <rect x="300" y="350" width="80" height="32" rx="6" fill="#f0f0f0" stroke="#ddd" stroke-width="1"/>
  <text x="340" y="370" font-size="12" fill="#555" text-anchor="middle">Cancel</text>
  <rect x="568" y="350" width="92" height="32" rx="6" fill="#888"/>
  <text x="614" y="370" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Create</text>
</svg>
