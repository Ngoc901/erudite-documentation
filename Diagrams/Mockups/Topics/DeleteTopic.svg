<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" font-family="Arial, sans-serif">
  <rect width="960" height="300" fill="#f0f0f0"/>
  <!-- Navbar -->
  <rect x="0" y="0" width="960" height="8" fill="#c8c8c8"/>
  <rect x="0" y="8" width="960" height="44" fill="#e8e8e8"/>
  <rect x="16" y="16" width="28" height="28" rx="6" fill="#aaa"/>
  <text x="52" y="36" font-size="15" font-weight="bold" fill="#333">Erudite</text>
  <text x="140" y="35" font-size="13" fill="#555">Courses</text>
  <text x="205" y="35" font-size="13" fill="#555">About Project</text>
  <text x="295" y="35" font-size="13" fill="#555">FAQ</text>
  <circle cx="930" cy="30" r="16" fill="#bbb"/>
  <circle cx="930" cy="24" r="5" fill="#fff"/>
  <path d="M916,40 Q916,33 930,33 Q944,33 944,40" fill="#fff"/>

  <!-- Modal backdrop -->
  <rect x="0" y="0" width="960" height="300" fill="#000" opacity="0.18"/>

  <!-- Dialog -->
  <rect x="330" y="72" width="300" height="192" rx="10" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <!-- Dialog header -->
  <rect x="330" y="72" width="300" height="44" rx="10" fill="#e8e8e8"/>
  <rect x="330" y="96" width="300" height="20" fill="#e8e8e8"/>
  <text x="480" y="100" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">Delete Topic</text>

  <!-- Warning text -->
  <text x="480" y="140" font-size="12" fill="#555" text-anchor="middle">Delete "Introduction to Python"?</text>
  <text x="480" y="160" font-size="11" fill="#888" text-anchor="middle">All lessons, challenges, and submissions</text>
  <text x="480" y="176" font-size="11" fill="#888" text-anchor="middle">within this topic will be permanently deleted.</text>

  <!-- Footer -->
  <line x1="330" y1="200" x2="630" y2="200" stroke="#eee" stroke-width="1"/>
  <rect x="350" y="212" width="80" height="32" rx="6" fill="#f0f0f0" stroke="#ddd" stroke-width="1"/>
  <text x="390" y="232" font-size="12" fill="#555" text-anchor="middle">Cancel</text>
  <rect x="500" y="212" width="110" height="32" rx="6" fill="#888"/>
  <text x="555" y="232" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Delete Topic</text>
</svg>
